<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart-Boat – Captain's Log</title>
<meta name="description" content="Captain's Log – das digitale Bordbuch für Segler.">
<link rel="icon" href="logo-icon.png">
<style>

    :root {
      --background: hsl(180 17% 98%);
      --foreground: hsl(206 79% 15%);
      --card: hsl(0 0% 100%);
      --primary: hsl(200 89% 25%);
      --primary-foreground: hsl(0 0% 100%);
      --secondary: hsl(182 77% 36%);
      --secondary-foreground: hsl(0 0% 100%);
      --muted: hsl(40 45% 92%);
      --muted-foreground: hsl(206 40% 40%);
      --accent: hsl(176 44% 94%);
      --accent-foreground: hsl(200 89% 25%);
      --border: hsl(206 20% 90%);
      --gold: hsl(38 62% 52%);
      --gold-soft: hsl(38 70% 94%);
      --dark-bg: hsl(206 45% 7%);
      --dark-card: hsl(206 38% 13%);
      --dark-border: hsl(206 25% 22%);
      --dark-primary: hsl(182 70% 48%);
      --dark-fg: hsl(206 15% 96%);
      --shadow-soft: 0 1px 2px -1px hsl(206 79% 15% / 0.06), 0 2px 8px -4px hsl(206 79% 15% / 0.06);
      --shadow-medium: 0 4px 14px -4px hsl(206 79% 15% / 0.10), 0 2px 6px -2px hsl(206 79% 15% / 0.06);
      --shadow-strong: 0 16px 40px -12px hsl(206 79% 15% / 0.22), 0 4px 12px -4px hsl(206 79% 15% / 0.10);
      --shadow-nav: 0 1px 0 hsl(206 40% 10% / 0.04), 0 8px 24px -12px hsl(206 40% 10% / 0.10);
      --r-lg: 16px;
      --r-md: 10px;
      --r-sm: 6px;
      --r-xl: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--background);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: var(--secondary); }
    h1, h2, h3 { margin: 0; letter-spacing: -0.02em; }
    p { margin: 0; }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 0 32px; }
    .eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--secondary); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 46px; padding: 0 28px; border-radius: var(--r-md);
      font-size: 15px; font-weight: 600; white-space: nowrap;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      cursor: pointer; border: 1px solid transparent;
    }
    .btn-primary { background: var(--primary); color: var(--primary-foreground); box-shadow: var(--shadow-soft); }
    .btn-primary:hover { background: hsl(200 89% 20%); transform: translateY(-1px); box-shadow: var(--shadow-medium); color: var(--primary-foreground); }
    .btn-sm { height: 38px; padding: 0 18px; font-size: 14px; border-radius: var(--r-md); }
    .badge {
      display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 12px;
      border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .badge-beta { background: hsl(38 85% 94%); color: hsl(28 75% 34%); }
    .badge-beta .badge-dot { background: hsl(32 85% 52%); }
    .icon { display: block; }
    section { position: relative; }
    .nav-link { font-size: 14px; font-weight: 500; color: hsl(206 40% 40%); position: relative; }
    .nav-link:hover { color: var(--primary); }
    .nav-link.active { color: var(--primary); }
    .lang-select {
      font-size: 13px; font-weight: 600; color: hsl(206 40% 40%);
      background: var(--card); border: 1px solid var(--border); border-radius: var(--r-sm);
      height: 34px; padding: 0 8px; cursor: pointer; transition: border-color 0.15s ease;
    }
    .lang-select:hover { border-color: var(--primary); color: var(--primary); }
    .store-badge {
      display: flex; align-items: center; gap: 10px; background: #fff;
      border: 1px solid hsl(206 20% 88%); border-radius: var(--r-md); padding: 10px 20px;
      cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: var(--shadow-soft);
    }
    .store-badge:hover { transform: translateY(-2px); box-shadow: var(--shadow-medium); }
    .store-badge.dark { background: #000; border-color: hsl(0 0% 100% / 0.22); box-shadow: none; }
    .store-badge.dark:hover { border-color: hsl(0 0% 100% / 0.45); }
    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: var(--shadow-strong); }
    .icon-chip {
      width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(155deg, var(--accent), hsl(176 44% 90%));
      border: 1px solid hsl(182 40% 84%);
      flex-shrink: 0;
    }
    .spec { background: var(--card); border-radius: var(--r-xl); padding: 20px; box-shadow: var(--shadow-soft); display: flex; align-items: flex-start; gap: 14px; }
    @media (max-width: 860px) {
      .wrap { padding: 0 20px; }
      .hide-mobile { display: none !important; }
      .hero-h1 { font-size: 36px !important; line-height: 1.14 !important; }
      .grid-3 { grid-template-columns: 1fr !important; }
      .grid-2 { grid-template-columns: 1fr !important; }
      .grid-footer { grid-template-columns: 1fr !important; gap: 32px !important; }
    }
  
</style>
</head>
<body>
<div id="app"></div>
<script id="tpl" type="text/x-template">
<!-- NAV -->
<div style="position: sticky; top: 0; z-index: 20; background: hsl(180 17% 98% / 0.92); backdrop-filter: blur(10px); box-shadow: var(--shadow-nav);">
  <div class="wrap" style="display: flex; align-items: center; justify-content: space-between; height: 76px;">
    <div style="display: flex; align-items: center; gap: 11px;">
      <img src="logo-icon.png" alt="" style="width: 32px; height: 32px; object-fit: contain;">
      <span style="font-size: 17.5px; font-weight: 800; color: var(--foreground); letter-spacing: -0.01em;">Captain&#39;s Log</span>
    </div>
    <div class="hide-mobile" style="display: flex; align-items: center; gap: 34px;">
      <a class="nav-link" href="/#funktionen">{{navFeatures}}</a>
      <a class="nav-link" href="/chartplotter">{{chartplotterName}}</a>
      <a class="nav-link active" href="/smartboat">Smart-Boat</a>
      <a class="nav-link" href="/#anleitungen">{{navGuides}}</a>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <select class="lang-select" value="de" aria-label="Sprache / Language">
        <option value="de">DE</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="fr">FR</option>
        <option value="it">IT</option>
        <option value="nl">NL</option>
        <option value="pt">PT</option>
      </select>
      <a href="/#download" class="btn btn-primary btn-sm">{{navGetApp}}</a>
    </div>
  </div>
</div>

<!-- HERO -->

    <div style="display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; justify-content: center;">

        <div style="line-height: 1.15; text-align: left;">
          <div style="font-size: 10px; color: hsl(200 30% 40%);">{{badgeComingSoon}}</div>
          <div style="font-size: 15px; font-weight: 700; color: hsl(200 89% 18%);">App Store</div>
        </div>
      </div>
      <a href="https://play.google.com/store/apps/details?id=com.harborstudios.captainslog" class="store-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3.6 2.9c-.4.3-.6.8-.6 1.4v15.4c0 .6.2 1.1.6 1.4l.1.1L13 12v-.2L3.7 2.8l-.1.1z" fill="#00a6c7"/><path d="M16.1 15 13 12v-.2l3.1-3.1 3.5 2c1 .6 1 1.5 0 2.1z" fill="#e0a800"/><path d="M13 12l3.1 3-9.5 5.4c-.5.3-1 .3-1.4 0z" fill="#d6303a"/><path d="M13 12 3.6 2.9c.4-.3.9-.3 1.4 0L16.1 9z" fill="#1fa855"/></svg>
        <div style="line-height: 1.15; text-align: left;">
          <div style="font-size: 10px; color: hsl(200 30% 40%);">{{badgeGetOn}}</div>
          <div style="font-size: 15px; font-weight: 700; color: hsl(200 89% 18%);">Google Play</div>
        </div>
      </a>
    </div>
    <p style="margin-top: 18px; font-size: 13.5px; color: hsl(200 25% 70%);">{{heroNote}}</p>
  </div>
  <svg viewBox="0 0 1440 64" style="display: block; width: 100%; height: 50px;" preserveAspectRatio="none">
    <path d="M0,34 C240,64 480,4 720,30 C960,56 1200,8 1440,32 L1440,64 L0,64 Z" fill="hsl(180 17% 98%)"></path>
  </svg>
</section>

<!-- PRODUKTFOTO / KONTROLLZENTRUM -->

<!-- TECHNISCHE DATEN -->
<section style="background: var(--muted); padding: 100px 0;">

    <div class="grid-2" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 44px; max-width: 780px; margin-left: auto; margin-right: auto;">

      <div class="spec card-hover">
        <div class="icon-chip" style="width: 42px; height: 42px; border-radius: 11px;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="hsl(200 89% 25%)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        </div>
        <div>
          <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted-foreground);">{{spec1Label}}</div>
          <div style="font-size: 15px; font-weight: 600; margin-top: 4px;">{{spec1Value}}</div>
        </div>
      </div>

    de: 'Das Kontrollzentrum zeigt Uhrzeit, Datum und deine aktuelle GPS-Position direkt in der Kopfzeile – ohne dass du extra in den Chartplotter wechseln musst.',
    en: 'The control center shows time, date, and your current GPS position right in the header – no need to switch over to the chartplotter.',
    es: 'El centro de control muestra la hora, la fecha y tu posición GPS actual directamente en la cabecera – sin tener que cambiar al cartógrafo.',
    fr: 'Le centre de contrôle affiche l\'heure, la date et votre position GPS actuelle directement dans l\'en-tête – sans avoir à basculer vers le traceur de cartes.',
    it: 'Il centro di controllo mostra ora, data e la tua posizione GPS attuale direttamente nell\'intestazione – senza dover passare al chartplotter.',
    nl: 'Het controlecentrum toont tijd, datum en je actuele GPS-positie direct in de kopregel – zonder dat je hoeft over te schakelen naar de kaartplotter.',
    pt: 'O centro de controlo mostra a hora, a data e a tua posição GPS atual diretamente no cabeçalho – sem teres de mudar para o chartplotter.',

  card6Title: { de: 'Verbindung testen, bevor es zählt', en: 'Test the connection before it matters', es: 'Comprueba la conexión antes de que importe', fr: 'Testez la connexion avant que ça compte', it: 'Testa la connessione prima che conti davvero', nl: 'Verbinding testen voordat het telt', pt: 'Testa a ligação antes que conte' },
  card6Desc: {
    de: 'Beim Einrichten prüfst du mit einem Tastendruck, ob ein Schalter im Bordnetz erreichbar ist und welchen Zustand er gerade meldet – so weißt du sofort, ob die Verkabelung stimmt.',
    en: 'While setting up, one tap checks whether a switch is reachable on the onboard network and what state it currently reports – so you know right away whether the wiring is right.',
    es: 'Al configurarlo, con un toque compruebas si un interruptor está disponible en la red de a bordo y qué estado indica en ese momento – así sabes al instante si el cableado es correcto.',
    fr: 'Lors de la configuration, un seul appui vérifie si un interrupteur est joignable sur le réseau de bord et quel état il signale – vous savez ainsi immédiatement si le câblage est correct.',
    it: 'Durante la configurazione, con un tocco verifichi se un interruttore è raggiungibile sulla rete di bordo e quale stato segnala in quel momento – così sai subito se il cablaggio è corretto.',
    nl: 'Bij het instellen controleer je met één tik of een schakelaar bereikbaar is in het boordnetwerk en welke status hij op dat moment meldt – zo weet je meteen of de bekabeling klopt.',
    pt: 'Ao configurar, com um toque verificas se um interruptor está acessível na rede de bordo e que estado está a comunicar – assim sabes de imediato se a cablagem está correta.',
  },
  photoH2: { de: 'Das Kontrollzentrum', en: 'The control center', es: 'El centro de control', fr: 'Le centre de contrôle', it: 'Il centro di controllo', nl: 'Het controlecentrum', pt: 'O centro de controlo' },
  photoDesc: {
    de: 'Bewusst dunkel gehalten und unabhängig vom hellen/dunklen Modus der App – gedacht für ein Tablet, das dauerhaft an Bord montiert bleibt, zum Beispiel an der Wand neben dem Niedergang. Die Kategorien und Kacheln im Bild sind Beispiele; auf deinem Boot legst du sie selbst an.',
    en: 'Deliberately dark, and independent of the app\'s regular light/dark mode – designed for a tablet that stays permanently mounted on board, for example on the wall by the companionway. The categories and tiles shown are examples; on your own boat, you set them up yourself.',
    es: 'Deliberadamente oscuro e independiente del modo claro/oscuro habitual de la app – pensado para una tablet que queda montada de forma permanente a bordo, por ejemplo en la pared junto a la escalerilla. Las categorías y los bloques mostrados son ejemplos; en tu barco los defines tú mismo.',
    fr: 'Volontairement sombre et indépendant du mode clair/sombre habituel de l\'app – pensé pour une tablette installée en permanence à bord, par exemple sur la cloison près de la descente. Les catégories et tuiles affichées sont des exemples ; sur votre bateau, c\'est vous qui les créez.',
    it: 'Volutamente scuro e indipendente dalla modalità chiara/scura abituale dell\'app – pensato per un tablet montato in modo permanente a bordo, ad esempio sulla parete accanto al passaggio scaletta. Le categorie e i riquadri mostrati sono esempi; sulla tua barca li crei tu.',
    nl: 'Bewust donker gehouden en onafhankelijk van de gebruikelijke licht/donker-modus van de app – bedoeld voor een tablet die permanent aan boord gemonteerd blijft, bijvoorbeeld aan de wand naast de trap. De categorieën en tegels op de afbeelding zijn voorbeelden; op jouw boot leg je ze zelf aan.',
    pt: 'Deliberadamente escuro e independente do modo claro/escuro habitual da app – pensado para um tablet que fica montado permanentemente a bordo, por exemplo na parede junto à escada. As categorias e os blocos mostrados são exemplos; no teu barco, és tu quem os cria.',
  },
  photoCaption: {
    de: 'Beispielansicht des Smart-Boat-Kontrollzentrums mit frei anlegbaren Kacheln für Licht, Pumpen und weitere Verbraucher.',
    en: 'Example view of the Smart-Boat control center with freely configurable tiles for lights, pumps, and other equipment.',
    es: 'Vista de ejemplo del centro de control Smart-Boat con bloques configurables libremente para luces, bombas y otros equipos.',
    fr: 'Exemple de vue du centre de contrôle Smart-Boat avec des tuiles librement configurables pour l\'éclairage, les pompes et d\'autres équipements.',
    it: 'Esempio di visualizzazione del centro di controllo Smart-Boat con riquadri configurabili liberamente per luci, pompe e altri impianti.',
    nl: 'Voorbeeldweergave van het Smart-Boat-controlecentrum met vrij samen te stellen tegels voor verlichting, pompen en andere verbruikers.',
    pt: 'Vista de exemplo do centro de controlo Smart-Boat com blocos configuráveis livremente para luzes, bombas e outros equipamentos.',

  connH2: { de: 'So funktioniert die Anbindung', en: 'How the connection works', es: 'Cómo funciona la conexión', fr: 'Comment fonctionne la connexion', it: 'Come funziona il collegamento', nl: 'Zo werkt de aansluiting', pt: 'Como funciona a ligação' },
  connSub: {
    de: 'Keine Cloud, kein Umweg über das Internet – Captain\'s Log spricht direkt mit den smarten Schaltern in deinem Bordnetz.',
    en: 'No cloud, no detour via the internet – Captain\'s Log talks directly to the smart switches on your onboard network.',
    es: 'Sin nube, sin rodeos por internet – Captain\'s Log habla directamente con los interruptores inteligentes de tu red de a bordo.',
    fr: 'Pas de cloud, pas de détour par internet – Captain\'s Log communique directement avec les interrupteurs intelligents de votre réseau de bord.',
    it: 'Nessun cloud, nessun passaggio da internet – Captain\'s Log comunica direttamente con gli interruttori intelligenti della tua rete di bordo.',
    nl: 'Geen cloud, geen omweg via internet – Captain\'s Log praat rechtstreeks met de slimme schakelaars in jouw boordnetwerk.',
    pt: 'Sem nuvem, sem passar pela internet – o Captain\'s Log fala diretamente com os interruptores inteligentes da tua rede de bordo.',
  },
  conn1Title: { de: 'Lokales WLAN statt Internet', en: 'Local Wi-Fi instead of the internet', es: 'Wi-Fi local en lugar de internet', fr: 'Wi-Fi local plutôt qu\'internet', it: 'Wi-Fi locale invece di internet', nl: 'Lokale wifi in plaats van internet', pt: 'Wi-Fi local em vez de internet' },
  conn1Desc: {
    de: 'Handy und Schalter hängen im selben Bord-WLAN und kommunizieren direkt miteinander. Das funktioniert auch ganz ohne Mobilfunkempfang, etwa vor Anker oder im Hafen ohne Netz.',
    en: 'Your phone and the switches share the same onboard Wi-Fi and talk to each other directly. That works even without any mobile signal, for example at anchor or in a harbour with no network.',
    es: 'El móvil y los interruptores están en la misma red Wi-Fi de a bordo y se comunican directamente entre sí. Esto funciona incluso sin cobertura móvil, por ejemplo fondeado o en un puerto sin red.',
    fr: 'Le téléphone et les interrupteurs sont sur le même Wi-Fi de bord et communiquent directement entre eux. Cela fonctionne même sans réseau mobile, par exemple au mouillage ou dans un port sans réseau.',
    it: 'Il telefono e gli interruttori sono sulla stessa rete Wi-Fi di bordo e comunicano direttamente tra loro. Funziona anche senza copertura mobile, ad esempio all\'ancora o in un porto senza rete.',
    nl: 'Je telefoon en de schakelaars zitten op hetzelfde boord-wifi en communiceren rechtstreeks met elkaar. Dit werkt ook zonder mobiel bereik, bijvoorbeeld voor anker of in een haven zonder netwerk.',
    pt: 'O telemóvel e os interruptores estão na mesma rede Wi-Fi de bordo e comunicam diretamente entre si. Isto funciona mesmo sem cobertura móvel, por exemplo fundeado ou num porto sem rede.',
  },
  conn2Title: { de: 'Gerät für Gerät einrichten', en: 'Set up device by device', es: 'Configura dispositivo por dispositivo', fr: 'Configuration appareil par appareil', it: 'Configurazione dispositivo per dispositivo', nl: 'Apparaat voor apparaat instellen', pt: 'Configura dispositivo a dispositivo' },
  conn2Desc: {
    de: 'Jeder Schalter wird einzeln mit Name, Netzwerkadresse, Gerätetyp und Kanal eingetragen. Mehrkanalige Geräte werden unterstützt, ein Gerät kann also mehrere Verbraucher gleichzeitig schalten.',
    en: 'Each switch is registered individually with a name, network address, device type, and channel. Multi-channel devices are supported, so a single device can switch several loads at once.',
    es: 'Cada interruptor se registra individualmente con un nombre, una dirección de red, un tipo de dispositivo y un canal. Se admiten dispositivos multicanal, por lo que uno solo puede controlar varios equipos a la vez.',
    fr: 'Chaque interrupteur est enregistré individuellement avec un nom, une adresse réseau, un type d\'appareil et un canal. Les appareils multicanaux sont pris en charge, un seul appareil peut donc commander plusieurs équipements à la fois.',
    it: 'Ogni interruttore viene registrato singolarmente con nome, indirizzo di rete, tipo di dispositivo e canale. Sono supportati i dispositivi multicanale, quindi un solo dispositivo può azionare più utenze contemporaneamente.',
    nl: 'Elke schakelaar wordt afzonderlijk ingesteld met naam, netwerkadres, apparaattype en kanaal. Meerkanaals-apparaten worden ondersteund, zodat één apparaat meerdere verbruikers tegelijk kan schakelen.',
    pt: 'Cada interruptor é registado individualmente com nome, endereço de rede, tipo de dispositivo e canal. Dispositivos multicanal são suportados, pelo que um único dispositivo pode comandar vários equipamentos ao mesmo tempo.',
  },
  conn3Title: { de: 'Zwei Gerätegenerationen unterstützt', en: 'Two device generations supported', es: 'Dos generaciones de dispositivos compatibles', fr: 'Deux générations d\'appareils prises en charge', it: 'Due generazioni di dispositivi supportate', nl: 'Twee apparaatgeneraties ondersteund', pt: 'Duas gerações de dispositivos suportadas' },
  conn3Desc: {
    de: 'Sowohl ältere Einzelrelais als auch neuere Mehrkanal-Geräte der aktuellen Generation lassen sich anbinden – die App erkennt anhand des gewählten Typs automatisch das passende Kommunikationsprotokoll.',
    en: 'Both older single-relay devices and newer multi-channel devices of the current generation can be connected – the app automatically picks the right communication protocol based on the selected type.',
    es: 'Se pueden conectar tanto los relés individuales más antiguos como los dispositivos multicanal más recientes de la generación actual – la app elige automáticamente el protocolo de comunicación adecuado según el tipo seleccionado.',
    fr: 'Aussi bien les anciens relais simples que les appareils multicanaux plus récents de la génération actuelle peuvent être connectés – l\'app choisit automatiquement le bon protocole de communication selon le type sélectionné.',
    it: 'Sia i vecchi relè singoli sia i più recenti dispositivi multicanale dell\'attuale generazione possono essere collegati – l\'app sceglie automaticamente il protocollo di comunicazione giusto in base al tipo selezionato.',
    nl: 'Zowel oudere enkelvoudige relais als nieuwere meerkanaals-apparaten van de huidige generatie kunnen worden aangesloten – de app kiest op basis van het gekozen type automatisch het juiste communicatieprotocol.',
    pt: 'Tanto os relés simples mais antigos como os dispositivos multicanal mais recentes da geração atual podem ser ligados – a app escolhe automaticamente o protocolo de comunicação certo consoante o tipo selecionado.',
  },
  conn4Title: { de: 'Sicher schalten', en: 'Switching you can trust', es: 'Conmutación fiable', fr: 'Une commutation fiable', it: 'Comando affidabile', nl: 'Betrouwbaar schakelen', pt: 'Comutação de confiança' },
  conn4Desc: {
    de: 'Jeder Schaltbefehl bekommt eine Rückmeldung mit dem tatsächlich erreichten Zustand, statt blind davon auszugehen, dass er angekommen ist. Ist ein Gerät nicht erreichbar, siehst du das sofort statt eines falschen "An".',
    en: 'Every switching command gets a response confirming the state it actually reached, instead of blindly assuming it arrived. If a device isn\'t reachable, you see that right away instead of a false "on".',
    es: 'Cada orden de conmutación recibe una confirmación del estado realmente alcanzado, en lugar de asumir a ciegas que ha llegado. Si un dispositivo no está disponible, lo ves de inmediato en vez de un falso "encendido".',
    fr: 'Chaque commande de commutation reçoit une confirmation de l\'état réellement atteint, plutôt que de supposer aveuglément qu\'elle est arrivée. Si un appareil n\'est pas joignable, vous le voyez immédiatement au lieu d\'un faux "allumé".',
    it: 'Ogni comando di accensione riceve una conferma dello stato effettivamente raggiunto, invece di presumere ciecamente che sia arrivato. Se un dispositivo non è raggiungibile, lo vedi subito invece di un falso "acceso".',
    nl: 'Elk schakelcommando krijgt een bevestiging van de daadwerkelijk bereikte status, in plaats van blind aan te nemen dat het is aangekomen. Is een apparaat niet bereikbaar, dan zie je dat meteen in plaats van een onterecht "aan".',
    pt: 'Cada comando de comutação recebe uma confirmação do estado realmente alcançado, em vez de assumir cegamente que chegou. Se um dispositivo não estiver acessível, vês isso de imediato em vez de um falso "ligado".',
  },

(function () {
  var tplEl = document.getElementById('tpl');
  var appEl = document.getElementById('app');
  var template = tplEl.textContent;
  var SUPPORTED = ['de','en','es','fr','it','nl','pt'];
  var state = { lang: (function(){
    try {
      var saved = localStorage.getItem('cl_lang');
      return (saved && SUPPORTED.indexOf(saved) !== -1) ? saved : 'de';
    } catch(e) { return 'de'; }
  })() };

  function render() {
    var lang = state.lang;
    var html = template.replace(/\{\{(\w+)\}\}/g, function (m, key) {
      if (key === 'lang') return lang;
      var entry = T[key];
      if (!entry) return '';
      return entry[lang] || entry.de || '';
    });
    appEl.innerHTML = html;
    var sel = appEl.querySelector('.lang-select');
    if (sel) sel.value = lang;
    document.documentElement.setAttribute('lang', lang);
  }

  appEl.addEventListener('change', function (e) {
    if (e.target && e.target.classList.contains('lang-select')) {
      state.lang = e.target.value;
      try { localStorage.setItem('cl_lang', state.lang); } catch (e) {}
      render();
    }
  });

  // Newsletter signup (used on pages that include a form.newsletter-form).
  // Calls the same public Supabase edge function the app itself uses;
  // this anon key is meant to be public and is already shipped in the app's
  // own client bundle.
  var NEWSLETTER_URL = 'https://qetkfoorfegjjycblokn.supabase.co/functions/v1/newsletter-signup';
  var NEWSLETTER_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFldGtmb29yZmVnamp5Y2Jsb2tuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkxNzU5MTksImV4cCI6MjA3NDc1MTkxOX0.FPnVji3DBgc8avs0Btjmb3wYluYfeJfpIQdR48brd1U';

  appEl.addEventListener('submit', function (e) {
    var form = e.target;
    if (!form || !form.classList || !form.classList.contains('newsletter-form')) return;
    e.preventDefault();

    var wrap = form.parentElement;
    var successEl = wrap ? wrap.querySelector('.newsletter-success') : null;
    var alreadyEl = wrap ? wrap.querySelector('.newsletter-already') : null;
    var errorEl = wrap ? wrap.querySelector('.newsletter-error') : null;
    [successEl, alreadyEl, errorEl].forEach(function (el) { if (el) el.style.display = 'none'; });

    var input = form.querySelector('input[type="email"]');
    var btn = form.querySelector('button');
    var email = input ? input.value.trim() : '';
    if (!email) return;

    if (btn) btn.disabled = true;
    fetch(NEWSLETTER_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': NEWSLETTER_KEY,
        'Authorization': 'Bearer ' + NEWSLETTER_KEY
      },
      body: JSON.stringify({ email: email, locale: state.lang })
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (res.ok && res.data && res.data.status === 'already_subscribed') {
          if (alreadyEl) alreadyEl.style.display = 'block';
        } else if (res.ok) {
          if (successEl) successEl.style.display = 'block';
          form.style.display = 'none';
        } else {
          throw new Error('newsletter signup failed');
        }
      })
      .catch(function () {
        if (errorEl) errorEl.style.display = 'block';
      })
      .then(function () {
        if (btn) btn.disabled = false;
      });
  });

  render();
})();
