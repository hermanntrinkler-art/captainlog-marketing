<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart-Boat – Captain's Log</title>
<meta name="description" content="Captain's Log – das digitale Bordbuch für Segler.">
<link rel="icon" href="logo-icon.png">
<style>

    :root {
      --background: hsl(180 17% 98%);
      --foreground: hsl(206 79% 15%);
      --card: hsl(0 0% 100%);
      --primary: hsl(200 89% 25%);
      --primary-foreground: hsl(0 0% 100%);
      --secondary: hsl(182 77% 36%);
      --secondary-foreground: hsl(0 0% 100%);
      --muted: hsl(40 45% 92%);
      --muted-foreground: hsl(206 40% 40%);
      --accent: hsl(176 44% 94%);
      --accent-foreground: hsl(200 89% 25%);
      --border: hsl(206 20% 90%);
      --gold: hsl(38 62% 52%);
      --gold-soft: hsl(38 70% 94%);
      --dark-bg: hsl(206 45% 7%);
      --dark-card: hsl(206 38% 13%);
      --dark-border: hsl(206 25% 22%);
      --dark-primary: hsl(182 70% 48%);
      --dark-fg: hsl(206 15% 96%);
      --shadow-soft: 0 1px 2px -1px hsl(206 79% 15% / 0.06), 0 2px 8px -4px hsl(206 79% 15% / 0.06);
      --shadow-medium: 0 4px 14px -4px hsl(206 79% 15% / 0.10), 0 2px 6px -2px hsl(206 79% 15% / 0.06);
      --shadow-strong: 0 16px 40px -12px hsl(206 79% 15% / 0.22), 0 4px 12px -4px hsl(206 79% 15% / 0.10);
      --shadow-nav: 0 1px 0 hsl(206 40% 10% / 0.04), 0 8px 24px -12px hsl(206 40% 10% / 0.10);
      --r-lg: 16px;
      --r-md: 10px;
      --r-sm: 6px;
      --r-xl: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--background);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: var(--secondary); }
    h1, h2, h3 { margin: 0; letter-spacing: -0.02em; }
    p { margin: 0; }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 0 32px; }
    .eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--secondary); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 46px; padding: 0 28px; border-radius: var(--r-md);
      font-size: 15px; font-weight: 600; white-space: nowrap;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      cursor: pointer; border: 1px solid transparent;
    }
    .btn-primary { background: var(--primary); color: var(--primary-foreground); box-shadow: var(--shadow-soft); }
    .btn-primary:hover { background: hsl(200 89% 20%); transform: translateY(-1px); box-shadow: var(--shadow-medium); color: var(--primary-foreground); }
    .btn-sm { height: 38px; padding: 0 18px; font-size: 14px; border-radius: var(--r-md); }
    .badge {
      display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 12px;
      border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .badge-beta { background: hsl(38 85% 94%); color: hsl(28 75% 34%); }
    .badge-beta .badge-dot { background: hsl(32 85% 52%); }
    .icon { display: block; }
    section { position: relative; }
    .nav-link { font-size: 14px; font-weight: 500; color: hsl(206 40% 40%); position: relative; }
    .nav-link:hover { color: var(--primary); }
    .nav-link.active { color: var(--primary); }
    .lang-select {
      font-size: 13px; font-weight: 600; color: hsl(206 40% 40%);
      background: var(--card); border: 1px solid var(--border); border-radius: var(--r-sm);
      height: 34px; padding: 0 8px; cursor: pointer; transition: border-color 0.15s ease;
    }
    .lang-select:hover { border-color: var(--primary); color: var(--primary); }
    .store-badge {
      display: flex; align-items: center; gap: 10px; background: #fff;
      border: 1px solid hsl(206 20% 88%); border-radius: var(--r-md); padding: 10px 20px;
      cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: var(--shadow-soft);
    }
    .store-badge:hover { transform: translateY(-2px); box-shadow: var(--shadow-medium); }
    .store-badge.dark { background: #000; border-color: hsl(0 0% 100% / 0.22); box-shadow: none; }
    .store-badge.dark:hover { border-color: hsl(0 0% 100% / 0.45); }
    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: var(--shadow-strong); }
    .icon-chip {
      width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(155deg, var(--accent), hsl(176 44% 90%));
      border: 1px solid hsl(182 40% 84%);
      flex-shrink: 0;
    }
    .spec { background: var(--card); border-radius: var(--r-xl); padding: 20px; box-shadow: var(--shadow-soft); display: flex; align-items: flex-start; gap: 14px; }
    @media (max-width: 860px) {
      .wrap { padding: 0 20px; }
      .hide-mobile { display: none !important; }
      .hero-h1 { font-size: 36px !important; line-height: 1.14 !important; }
      .grid-3 { grid-template-columns: 1fr !important; }
      .grid-2 { grid-template-columns: 1fr !important; }
      .grid-footer { grid-template-columns: 1fr !important; gap: 32px !important; }
    }
  
</style>
</head>
<body>
<div id="app"></div>
<script id="tpl" type="text/x-template">
<!-- NAV -->
<div style="position: sticky; top: 0; z-index: 20; background: hsl(180 17% 98% / 0.92); backdrop-filter: blur(10px); box-shadow: var(--shadow-nav);">
  <div class="wrap" style="display: flex; align-items: center; justify-content: space-between; height: 76px;">
    <div style="display: flex; align-items: center; gap: 11px;">
      <img src="logo-icon.png" alt="" style="width: 32px; height: 32px; object-fit: contain;">
      <span style="font-size: 17.5px; font-weight: 800; color: var(--foreground); letter-spacing: -0.01em;">Captain&#39;s Log</span>
    </div>
    <div class="hide-mobile" style="display: flex; align-items: center; gap: 34px;">
      <a class="nav-link" href="/#funktionen">{{navFeatures}}</a>
      <a class="nav-link" href="/chartplotter">{{chartplotterName}}</a>
      <a class="nav-link active" href="/smartboat">Smart-Boat</a>
      <a class="nav-link" href="/#anleitungen">{{navGuides}}</a>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <select class="lang-select" value="de" aria-label="Sprache / Language">
        <option value="de">DE</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="fr">FR</option>
        <option value="it">IT</option>
        <option value="nl">NL</option>
        <option value="pt">PT</option>
      </select>
      <a href="/#download" class="btn btn-primary btn-sm">{{navGetApp}}</a>
    </div>
  </div>
</div>

<!-- HERO -->
<section style="background: linear-gradient(155deg, hsl(206 45% 8%), hsl(200 60% 14%) 50%, hsl(182 55% 16%)); overflow: hidden;">
  <div style="position: absolute; inset: 0; opacity: 0.5; background: radial-gradient(ellipse 640px 420px at 84% 8%, hsl(38 70% 50% / 0.16), transparent 70%), radial-gradient(ellipse 520px 380px at 6% 92%, hsl(182 70% 40% / 0.22), transparent 70%);"></div>
  <div class="wrap" style="padding-top: 96px; padding-bottom: 80px; max-width: 680px; text-align: center; position: relative; z-index: 1;">
    <span class="badge badge-beta"><span class="badge-dot"></span>Beta</span>
    <h1 class="hero-h1" style="font-size: 50px; line-height: 1.08; color: #fff; font-weight: 800; margin-top: 22px;">Smart-Boat</h1>
    <p style="margin-top: 22px; font-size: 18px; line-height: 1.62; color: hsl(200 25% 85%); max-width: 560px; margin-left: auto; margin-right: auto;">
      {{heroSubtitle}}
    </p>
    <div style="display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; justify-content: center;">
      <a href="https://app.captainlog.pro/" class="store-badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="hsl(200 89% 22%)"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8.98-.19 1.93-.87 2.95-.79 1.42.11 2.4.67 3.05 1.6-2.68 1.63-2.03 5.5.62 6.55-.5 1.31-1.14 2.6-1.7 4.81zM12.03 7.25c-.15-2.23 1.66-4.09 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        <div style="line-height: 1.15; text-align: left;">
          <div style="font-size: 10px; color: hsl(200 30% 40%);">{{badgeDownloadOn}}</div>
          <div style="font-size: 15px; font-weight: 700; color: hsl(200 89% 18%);">App Store</div>
        </div>
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.harborstudios.captainslog" class="store-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3.6 2.9c-.4.3-.6.8-.6 1.4v15.4c0 .6.2 1.1.6 1.4l.1.1L13 12v-.2L3.7 2.8l-.1.1z" fill="#00a6c7"/><path d="M16.1 15 13 12v-.2l3.1-3.1 3.5 2c1 .6 1 1.5 0 2.1z" fill="#e0a800"/><path d="M13 12l3.1 3-9.5 5.4c-.5.3-1 .3-1.4 0z" fill="#d6303a"/><path d="M13 12 3.6 2.9c.4-.3.9-.3 1.4 0L16.1 9z" fill="#1fa855"/></svg>
        <div style="line-height: 1.15; text-align: left;">
          <div style="font-size: 10px; color: hsl(200 30% 40%);">{{badgeGetOn}}</div>
          <div style="font-size: 15px; font-weight: 700; color: hsl(200 89% 18%);">Google Play</div>
        </div>
      </a>
    </div>
    <p style="margin-top: 18px; font-size: 13.5px; color: hsl(200 25% 70%);">{{heroNote}}</p>
  </div>
  <svg viewBox="0 0 1440 64" style="display: block; width: 100%; height: 50px;" preserveAspectRatio="none">
    <path d="M0,34 C240,64 480,4 720,30 C960,56 1200,8 1440,32 L1440,64 L0,64 Z" fill="hsl(180 17% 98%)"></path>
  </svg>
</section>

<!-- WAS SMART-BOAT KANN -->
<section style="padding: 12px 0 96px;">
  <div class="wrap">
    <div style="text-align: center; max-width: 640px; margin: 0 auto;">
      <span class="eyebrow">Smart-Boat</span>
      <h2 style="font-size: 32px; font-weight: 800; margin-top: 10px;">{{section1H2}}</h2>
    </div>
    <div class="grid-3" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; margin-top: 52px;">

      <div class="card-hover" style="background: var(--card); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 30px; box-shadow: var(--shadow-soft);">
        <div class="icon-chip">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="hsl(200 89% 25%)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h8l-1 8 10-12h-8z"/></svg>
        </div>
        <h3 style="font-size: 18px; font-weight: 700; margin-top: 18px; margin-bottom: 10px;">{{card1Title}}</h3>
        <p style="font-size: 14.5px; line-height: 1.6; color: var(--muted-foreground);">{{card1Desc}}</p>
      </div>

      <div class="card-hover" style="background: var(--card); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 30px; box-shadow: var(--shadow-soft);">
        <div class="icon-chip">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="hsl(200 89% 25%)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <h3 style="font-size: 18px; font-weight: 700; margin-top: 18px; margin-bottom: 10px;">{{card2Title}}</h3>
        <p style="font-size: 14.5px; line-height: 1.6; color: var(--muted-foreground);">{{card2Desc}}</p>
      </div>

      <div class="card-hover" style="background: var(--card); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 30px; box-shadow: var(--shadow-soft);">
        <div class="icon-chip">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="hsl(200 89% 25%)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        <h3 style="font-size: 18px; font-weight: 700; margin-top: 18px; margin-bottom: 10px;">{{card3Title}}</h3>
        <p style="font-size: 14.5px; line-height: 1.6; color: var(--muted-foreground);">{{card3Desc}}</p>
      </div>

    </div>
  </div>
</section>

<!-- DIE SMART-BOAT-BOX -->
<section style="background: var(--accent); padding: 104px 0;">
  <div class="wrap" style="max-width: 680px; text-align: center;">
    <span class="eyebrow">Smart-Boat</span>
    <h2 style="font-size: 32px; font-weight: 800; margin-top: 10px;">{{boxH2}}</h2>
    <p style="font-size: 16px; line-height: 1.65; color: hsl(200 40% 22%); margin-top: 16px;">
      {{boxDesc}}
    </p>
  </div>
</section>

<!-- TECHNISCHE DATEN -->

  <div class="wrap">
    <div style="text-align: center; max-width: 560px; margin: 0 auto;">
      <h2 style="font-size: 28px; font-weight: 800;">{{techH2}}</h2>
      <p style="font-size: 14.5px; line-height: 1.6; color: var(--muted-foreground); margin-top: 10px;">{{techNote}}</p>
    </div>
    <div class="grid-2" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 44px; max-width: 780px; margin-left: auto; margin-right: auto;">

        </div>
        <div>
          <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted-foreground);">{{spec1Label}}</div>
          <div style="font-size: 15px; font-weight: 600; margin-top: 4px;">{{spec1Value}}</div>
        </div>
      </div>

      <div class="spec card-hover">
        <div class="icon-chip" style="width: 42px; height: 42px; border-radius: 11px;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="hsl(200 89% 25%)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="16" height="6" rx="1"/><path d="M18 10v4"/><path d="M20 11v2"/></svg>
        </div>
        <div>
          <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted-foreground);">{{spec2Label}}</div>
          <div style="font-size: 15px; font-weight: 600; margin-top: 4px;">{{spec2Value}}</div>
        </div>
      </div>

      <div class="spec card-hover">
        <div class="icon-chip" style="width: 42px; height: 42px; border-radius: 11px;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="hsl(200 89% 25%)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M6 19V9l6-4 6 4v10"/></svg>
        </div>
        <div>
          <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted-foreground);">{{spec3Label}}</div>
          <div style="font-size: 15px; font-weight: 600; margin-top: 4px;">{{spec3Value}}</div>
        </div>
      </div>

      <div class="spec card-hover">
        <div class="icon-chip" style="width: 42px; height: 42px; border-radius: 11px;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="hsl(200 89% 25%)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        </div>
        <div>
          <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted-foreground);">{{spec4Label}}</div>
          <div style="font-size: 15px; font-weight: 600; margin-top: 4px;">{{spec4Value}}</div>
        </div>
      </div>

      <div class="spec card-hover">
        <div class="icon-chip" style="width: 42px; height: 42px; border-radius: 11px;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="hsl(200 89% 25%)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        </div>
        <div>
          <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted-foreground);">{{spec5Label}}</div>
          <div style="font-size: 15px; font-weight: 600; margin-top: 4px;">{{spec5Value}}</div>
        </div>
      </div>

      <div class="spec card-hover">
        <div class="icon-chip" style="width: 42px; height: 42px; border-radius: 11px;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="hsl(200 89% 25%)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
        </div>
        <div>
          <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted-foreground);">{{spec6Label}}</div>
          <div style="font-size: 15px; font-weight: 600; margin-top: 4px;">{{spec6Value}}</div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- STATUS -->
<section style="background: var(--muted); padding: 96px 0;">
  <div class="wrap" style="max-width: 640px; text-align: center;">
    <span class="badge badge-beta"><span class="badge-dot"></span>Beta</span>
    <h2 style="font-size: 28px; font-weight: 800; margin-top: 18px;">{{statusH2}}</h2>
    <p style="font-size: 15.5px; line-height: 1.65; color: var(--muted-foreground); margin-top: 16px;">
      {{statusDesc}}
    </p>
  </div>
</section>

<!-- CTA -->
<section style="background: linear-gradient(135deg, hsl(200 89% 21%), hsl(182 68% 22%)); padding: 84px 0; overflow: hidden;">
  <div style="position: absolute; inset: 0; opacity: 0.6; background: radial-gradient(ellipse 600px 340px at 50% 0%, hsl(182 70% 40% / 0.25), transparent 70%);"></div>
  <div class="wrap" style="text-align: center; position: relative;">
    <h2 style="font-size: 30px; font-weight: 800; color: #fff;">{{ctaH2}}</h2>
    <p style="font-size: 15.5px; color: hsl(200 25% 85%); margin-top: 12px;">{{ctaDesc}}</p>
    <div style="display: flex; gap: 12px; justify-content: center; margin-top: 32px; flex-wrap: wrap;">
      <a href="https://app.captainlog.pro/" class="store-badge dark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8.98-.19 1.93-.87 2.95-.79 1.42.11 2.4.67 3.05 1.6-2.68 1.63-2.03 5.5.62 6.55-.5 1.31-1.14 2.6-1.7 4.81zM12.03 7.25c-.15-2.23 1.66-4.09 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        <div style="line-height: 1.15; text-align: left;">
          <div style="font-size: 10px; color: hsl(0 0% 100% / 0.7);">{{badgeDownloadOn}}</div>
          <div style="font-size: 15px; font-weight: 700; color: #fff;">App Store</div>
        </div>
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.harborstudios.captainslog" class="store-badge dark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3.6 2.9c-.4.3-.6.8-.6 1.4v15.4c0 .6.2 1.1.6 1.4l.1.1L13 12v-.2L3.7 2.8l-.1.1z" fill="#00d4ff"/><path d="M16.1 15 13 12v-.2l3.1-3.1 3.5 2c1 .6 1 1.5 0 2.1z" fill="#ffcf00"/><path d="M13 12l3.1 3-9.5 5.4c-.5.3-1 .3-1.4 0z" fill="#ff3a44"/><path d="M13 12 3.6 2.9c.4-.3.9-.3 1.4 0L16.1 9z" fill="#00e676"/></svg>
        <div style="line-height: 1.15; text-align: left;">
          <div style="font-size: 10px; color: hsl(0 0% 100% / 0.7);">{{badgeGetOn}}</div>
          <div style="font-size: 15px; font-weight: 700; color: #fff;">Google Play</div>
        </div>
      </a>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer style="background: var(--dark-bg); padding: 68px 0 32px;">
  <div class="wrap">

(function () {
  var tplEl = document.getElementById('tpl');
  var appEl = document.getElementById('app');
  var template = tplEl.textContent;
  var SUPPORTED = ['de','en','es','fr','it','nl','pt'];
  var state = { lang: (function(){
    try {
      var saved = localStorage.getItem('cl_lang');
      return (saved && SUPPORTED.indexOf(saved) !== -1) ? saved : 'de';
    } catch(e) { return 'de'; }
  })() };

  function render() {
    var lang = state.lang;
    var html = template.replace(/\{\{(\w+)\}\}/g, function (m, key) {
      if (key === 'lang') return lang;
      var entry = T[key];
      if (!entry) return '';
      return entry[lang] || entry.de || '';
    });
    appEl.innerHTML = html;
    var sel = appEl.querySelector('.lang-select');
    if (sel) sel.value = lang;
    document.documentElement.setAttribute('lang', lang);
  }

  appEl.addEventListener('change', function (e) {
    if (e.target && e.target.classList.contains('lang-select')) {
      state.lang = e.target.value;
      try { localStorage.setItem('cl_lang', state.lang); } catch (e) {}
      render();
    }
  });

  render();
})();
